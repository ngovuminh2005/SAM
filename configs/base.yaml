# LLaVA-1.5 Stage 2 (instruction tuning) recipe shared by every VFM tuning type,
# taken from scripts/v1_5/*.sh. Stack: --config configs/base.yaml
#   --config configs/vfm/<type>.yaml --config configs/sam/<method>.yaml
# Batch size, gradient accumulation, DeepSpeed config and output_dir come from
# the launcher (scripts/v1_5/train_sweep.sh) or the command line.
model:
  model_name_or_path: lmsys/vicuna-7b-v1.5
  vision_tower: openai/clip-vit-large-patch14-336
  pretrain_mm_mlp_adapter: ./checkpoints/llava-v1.5-7b-pretrain/mm_projector.bin
  mm_projector_type: mlp2x_gelu
  mm_vision_select_layer: -2
  mm_use_im_start_end: false
  mm_use_im_patch_token: false
data:
  data_path: ./data/llava_finetune/llava_v1_5_mix665k.json
  image_folder: ./data/llava_finetune
  image_aspect_ratio: pad
  lazy_preprocess: true
training:
  bf16: true
  tf32: true
  num_train_epochs: 1
  learning_rate: 2.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  model_max_length: 2048
  gradient_checkpointing: true
  group_by_modality_length: true
  dataloader_num_workers: 4
  per_device_eval_batch_size: 4
  logging_steps: 1
  save_strategy: steps
  save_steps: 500         # resume point: rerun with the same output_dir (see README)
  save_total_limit: 1
  report_to: wandb
wandb:
  project: covft
