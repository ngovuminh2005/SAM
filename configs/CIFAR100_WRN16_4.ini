[general]
evalEvery = 20
logDir = logs
logSubDir = test
truncate = False

contin = False
epochs = 200

rndSeed = False
deterministic = False

optimizer = SGD
momentum = 0.9 
weightDecay = 0.0005
nesterov = False

saveCheckpoint = False
keepLastCheckpoint = False
checkpointsList = 
saveCheckpointInterval = 0

verbose = False
logEach = 1
metrics = learningRate loss accuracy

dataThreads = 6 
dataDir = ~/.datasets
batchSize = 256 
dataset = CIFAR100 
imageSize = 0 
flip = True 
crop = True
cut = True
cutoutProp = 0.5
randAugment = False 
randAugment_magnitude = 10
mixup = False
mixupProp = 0.2

label_smoothing = 0.1

grad_clip_norm = 0.0
normalize = std


[models]
model = WRN
dropout = 0.0
BN = True
depth = 16
widthFactor = 4
ViTPatchsize = 32
ViTSize = S

[learning rate]
learningRate = 0.5
lrScheduler = startRamp cos

LRScheduler_StartRamp_epochs = 1

LRScheduler_step_steps = 3
LRScheduler_step_gamma = 0.2

LRScheduler_exp_maxDecay = 0.01
LRScheduler_cos_periods = 0.5

LRScheduler_WRN_T0 = 50
LRScheduler_WRN_Tmult = 1.2

[SAM]
rho = 0.1
samRho = 0.1
asamRho = 1.0
esamRho = 0.1
looksamRho = 0.1
friendlysamRho = 0.2
fishersamRho = 0.1
mongesamRho = 0.1
gsamRho = 0.1
bayesiansamRho = 0.01
msamRho = 0.1
adamwSamRho = 0.1
adamSamRho = 0.1
adamwMsamRho = 0.1
adamwFriendlysamRho = 0.2
rhoScheduler = const
rhoScheduler_StartRamp_epochs = 8
rhoScheduler_StartJump_epochs = 8

[ESAM]
ESAMbeta = 0.5
ESAMgamma = 0.5

[lookSAM]
lookSAMk = 5
lookSAMalpha = 0.7
lookSAMLayerwise = False

[FriendlySAM]
sigma = 1.0
lmbda = 0.9

[GSAM]
gsamAlpha = 0.01
gsamAdaptive = False

[BayesianSAM]
bayesMSharpness = 8
bayesDelta = 10.0
bayesBeta1 = 0.9
bayesBeta2 = 0.999
bayesSInit = 1.0
bayesDamping = 1e-8
bayesEps = 1e-12

[FisherSAM]
fisherEta = 1.0

[PyramidNet]
pyramidAlpha = 270
pyramidBottleneck = True

[CondSAM]
condsamRho = -1
condsamBeta = 0.95
condsamEps = 1e-8
condsamPowerIters = 1
