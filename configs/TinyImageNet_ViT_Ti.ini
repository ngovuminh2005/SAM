# ViT-Tiny (SimpleViT) on Tiny ImageNet — train from scratch at native 64×64.
# ViTSize=Ti: embed_dim=192, depth=12, mlp_dim=768, heads=3.
# ViTPatchsize=8 → 8×8 patches on 64×64 (64 tokens). Override with 4 for finer patches (256 tokens, heavier).
[general]
evalEvery = 20
logDir = logs
logSubDir = test
truncate = False

contin = False
epochs = 200

rndSeed = False
deterministic = False

optimizer = Adam
momentum = 0.9
weightDecay = 0.0005
nesterov = False

saveCheckpoint = False
keepLastCheckpoint = False
checkpointsList =
saveCheckpointInterval = 0

verbose = False
logEach = 1
metrics = learningRate loss accuracy
topK = 

dataThreads = 6
dataDir = ~/.datasets
batchSize = 256
dataset = TinyImageNet
imageSize = 64
flip = True
crop = True
cut = False
cutoutProp = 0.5
randAugment = True
randAugment_magnitude = 10
mixup = False
mixupProp = 0.2

label_smoothing = 0.1

grad_clip_norm = 0.0
normalize = std


[models]
model = ViT
dropout = 0.0
BN = True
depth = 16
widthFactor = 4
ViTPatchsize = 8
ViTSize = Ti


[learning rate]
learningRate = 0.001
lrScheduler = cosWarmUp

LRScheduler_StartRamp_epochs = 10

LRScheduler_step_steps = 3
LRScheduler_step_gamma = 0.2

LRScheduler_exp_maxDecay = 0.01
LRScheduler_cos_periods = 0.5

LRScheduler_WRN_T0 = 50
LRScheduler_WRN_Tmult = 1.2

[SAM]
rho = 0.01
samRho = 0.01
asamRho = 1.0
esamRho = 0.075
looksamRho = 0.05
friendlysamRho = 0.01
fishersamRho = 0.01
mongesamRho = 0.075
gsamRho = 0.01
bayesiansamRho = 0.075
msamRho = 0.075
adamwSamRho = 0.075
adamSamRho = 0.075
adamwMsamRho = 0.075
adamwFriendlysamRho = 0.075
rhoScheduler = const
rhoScheduler_StartRamp_epochs = 8
rhoScheduler_StartJump_epochs = 8

[ESAM]
ESAMbeta = 0.5
ESAMgamma = 0.7

[lookSAM]
lookSAMk = 5
lookSAMalpha = 0.7
lookSAMLayerwise = False

[FriendlySAM]
sigma = 1.0
lmbda = 0.95

[GSAM]
gsamAlpha = 0.1
gsamAdaptive = False

[BayesianSAM]
bayesMSharpness = 8
bayesDelta = 10.0
bayesBeta1 = 0.9
bayesBeta2 = 0.999
bayesSInit = 1.0
bayesDamping = 1e-8
bayesEps = 1e-12

[FisherSAM]
fisherEta = 0.1

[PyramidNet]
pyramidAlpha = 270
pyramidBottleneck = True

[CondSAM]
condsamRho = -1
condsamBeta = 0.95
condsamEps = 1e-8
condsamPowerIters = 1
