name: condsam-adamw-rho-beta-poweriters
method: grid
program: scripts/run_sam.sh
metric:
  name: epoch_eval/ImageNet/top1
  goal: maximize
command:
  - ${env}
  - bash
  - ${program}
  - ${args}
parameters:
  model:
    value: ViT-B/32
  lr:
    value: 0.00003
  wd:
    value: 0.1
  sam-rho:
    values: [0.05, 0.5, 1.5, 1]
  condsam-beta:
    values: [0.99]
  condsam-power-iters:
    values: [5]
  optimizer:
    value: adamw
  sam:
    value: condsam
  sam-config:
    value: optimizer/defaults.ini
  epochs:
    value: 10
  batch-size:
    value: 512
  wandb-mode:
    value: online
