# ResNet-50, 88 epochs, for CondSAM (scripts/run_condsam.sh). Same as rn50_88_epochs.yaml
# except the schedule: the same linear warm-up to epoch 2, then a cosine decay to 0
# instead of a linear one. lr is for a global batch of 4096 (8 x 512).
data:
  in_memory: 1
  num_workers: 12
dist:
  world_size: 8
logging:
  folder: /tmp/
lr:
  lr: 1.7
  lr_schedule_type: cosine
  lr_peak_epoch: 2
model:
  arch: resnet50
resolution:
  end_ramp: 76
  max_res: 192
  min_res: 160
  start_ramp: 65
training:
  batch_size: 512
  bn_wd: 0
  distributed: 1
  epochs: 88
  label_smoothing: 0.1
  momentum: 0.9
  optimizer: sgd
  weight_decay: 0.0001
  use_blurpool: 1
validation:
  lr_tta: true
  resolution: 256
